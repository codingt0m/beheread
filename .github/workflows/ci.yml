# Verification continue de Beheread sous Windows et macOS.
#
# A chaque push sur main (et sur chaque pull request) :
# * verification du code (ruff) et tests (pytest), sur les deux systemes ;
# * construction de l'application macOS (.dmg) et captures d'ecran de
#   l'interface sur un vrai macOS, jointes a l'execution comme artefacts
#   (onglet Actions) : de quoi verifier le rendu et faire tester l'application
#   sans Mac sous la main ni release.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# actions epinglees par SHA (version en commentaire), checkout sans jeton conserve
permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Dependances
        run: python -m pip install -r requirements-dev.txt

      - name: Verification du code
        run: python -m ruff check .

      - name: Tests
        run: python -m pytest -q

  macos-app:
    needs: tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Dependances
        run: python -m pip install -r requirements-dev.txt

      - name: Build (verification, tests, application, image disque)
        run: bash packaging/macos/build.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: Beheread-macos
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/Beheread-*-macos.dmg
            dist/SHA256SUMS-macos.txt

      - name: Captures d'ecran
        if: ${{ !cancelled() }}
        run: python tools/screenshots.py captures

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: captures-macos
          path: captures/
          retention-days: 14
