# Verification continue de Beheread sous Windows et macOS.
#
# A chaque push sur main (et sur chaque pull request) : verification du code
# (ruff) et tests (pytest), sur les deux systemes pris en charge. C'est le
# filet de securite du portage macOS : une regression d'un cote ou de l'autre
# se voit sans avoir la machine sous la main.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Dependances
        run: python -m pip install -r requirements-dev.txt

      - name: Verification du code
        run: python -m ruff check .

      - name: Tests
        run: python -m pytest -q
