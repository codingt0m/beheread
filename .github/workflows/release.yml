# Publication d'une version de Beheread.
#
# Pousser un tag vX.Y.Z (identique a beheread/version.py) construit
# l'application avec build.bat - le meme script qu'en local - et cree une
# release GitHub en BROUILLON avec l'installateur, l'archive sans installation
# et leurs sommes de controle. Le job build-macos y ajoute ensuite l'image
# disque macOS (packaging/macos/build.sh). Les notes viennent de la section X.Y.Z de
# CHANGELOG.md. Le brouillon se relit puis se publie depuis l'onglet Releases.
#
# Lancement manuel (onglet Actions > Release > Run workflow) : essai a blanc,
# les fichiers sont joints a l'execution comme artefacts, sans creer de release.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Dependances
        run: python -m pip install -r requirements-dev.txt

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Version
        id: version
        shell: bash
        run: |
          version=$(python -c "from beheread.version import __version__; print(__version__)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas a beheread/version.py ($version)"
            exit 1
          fi

      - name: Notes de version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md n'a pas de section [$VERSION]"
            exit 1
          fi

      - name: Build (verification, tests, exe, installateur, archive)
        shell: cmd
        run: build.bat

      - uses: actions/upload-artifact@v7
        with:
          name: Beheread-${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: |
            dist/Beheread-Setup-${{ steps.version.outputs.version }}.exe
            dist/Beheread-${{ steps.version.outputs.version }}-windows-x64.zip
            dist/SHA256SUMS.txt

      - name: Release (brouillon)
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Beheread $VERSION" --notes-file release-notes.md \
            "dist/Beheread-Setup-$VERSION.exe" \
            "dist/Beheread-$VERSION-windows-x64.zip" \
            dist/SHA256SUMS.txt

  # Version macOS (Apple Silicon) : construite apres la version Windows, elle
  # ajoute son image disque au meme brouillon de release. Un echec ici ne
  # bloque pas la publication de la version Windows (continue-on-error).
  build-macos:
    needs: build
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Dependances
        run: python -m pip install -r requirements-dev.txt

      - name: Version
        id: version
        run: echo "version=$(python -c 'from beheread.version import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      - name: Build (verification, tests, application, image disque)
        run: bash packaging/macos/build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: Beheread-${{ steps.version.outputs.version }}-macos
          if-no-files-found: error
          path: |
            dist/Beheread-${{ steps.version.outputs.version }}-macos.dmg
            dist/SHA256SUMS-macos.txt

      - name: Ajout au brouillon de release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "dist/Beheread-$VERSION-macos.dmg" dist/SHA256SUMS-macos.txt
