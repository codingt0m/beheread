# Publication d'une version de Beheread.
#
# Pousser un tag vX.Y.Z (identique a beheread/version.py) construit
# l'application avec build.bat - le meme script qu'en local - et cree une
# release GitHub en BROUILLON avec l'installateur, l'archive sans installation
# et leurs sommes de controle. Le job build-macos construit ensuite l'image
# disque macOS (packaging/macos/build.sh), ajoutee au meme brouillon. Les notes
# viennent de la section X.Y.Z de CHANGELOG.md. Le brouillon se relit puis se
# publie depuis l'onglet Releases.
#
# Securite : les jobs de build executent du code tiers (dependances pip,
# PyInstaller, Inno Setup) et n'ont donc qu'un acces en LECTURE au depot, sans
# jeton conserve par le checkout. Seuls les petits jobs release et
# release-macos, qui ne font que publier les fichiers deja construits, ont le
# droit d'ecrire. Les actions sont epinglees par SHA (version en commentaire).
#
# Lancement manuel (onglet Actions > Release > Run workflow) : essai a blanc,
# les fichiers sont joints a l'execution comme artefacts, sans creer de release.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Dependances
        run: python -m pip install -r requirements-dev.txt

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Version
        id: version
        shell: bash
        run: |
          version=$(python -c "from beheread.version import __version__; print(__version__)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas a beheread/version.py ($version)"
            exit 1
          fi

      - name: Notes de version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md n'a pas de section [$VERSION]"
            exit 1
          fi

      - name: Build (verification, tests, exe, installateur, archive)
        shell: cmd
        run: build.bat

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: Beheread-${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: |
            dist/Beheread-Setup-${{ steps.version.outputs.version }}.exe
            dist/Beheread-${{ steps.version.outputs.version }}-windows-x64.zip
            dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-notes
          if-no-files-found: error
          path: release-notes.md

  # Creation du brouillon : aucun code du depot n'est execute ici, seulement
  # la publication des fichiers construits par le job build.
  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: Beheread-${{ needs.build.outputs.version }}
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-notes

      - name: Release (brouillon)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Beheread $VERSION" --notes-file release-notes.md \
            "dist/Beheread-Setup-$VERSION.exe" \
            "dist/Beheread-$VERSION-windows-x64.zip" \
            dist/SHA256SUMS.txt

  # Version macOS (Apple Silicon) : construite apres la version Windows. Un
  # echec ici ne bloque pas la publication de la version Windows
  # (continue-on-error).
  build-macos:
    needs: build
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Dependances
        run: python -m pip install -r requirements-dev.txt

      - name: Build (verification, tests, application, image disque)
        run: bash packaging/macos/build.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: Beheread-${{ needs.build.outputs.version }}-macos
          if-no-files-found: error
          path: |
            dist/Beheread-${{ needs.build.outputs.version }}-macos.dmg
            dist/SHA256SUMS-macos.txt

  # Ajout de l'image disque au brouillon cree par le job release.
  release-macos:
    needs: [build, release, build-macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: Beheread-${{ needs.build.outputs.version }}-macos
          path: dist

      - name: Ajout au brouillon de release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "dist/Beheread-$VERSION-macos.dmg" dist/SHA256SUMS-macos.txt
