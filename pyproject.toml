# Configuration des outils de developpement. Beheread n'est pas distribue
# comme paquet Python : ses dependances sont dans requirements.txt
# (utilisation) et requirements-dev.txt (tests, build), sa version dans
# beheread/version.py.

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# F : noms indefinis, imports et variables inutiles ; E9 : erreurs de syntaxe ;
# I : ordre des imports ; B (bugbear) : pieges reels (variable de boucle
# capturee par une fonction, zip qui tronque en silence, exception relancee
# sans sa cause). Les regles de style ne sont pas adoptees par le projet.
select = ["F", "E9", "I", "B"]

[tool.mypy]
# Verification des types de la logique pure (core/ : sans Qt, ni disque, ni
# reseau) : python -m mypy. Les modules hors de core/ ne sont lus que pour
# leurs signatures.
files = ["beheread/core"]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
